services:
  - type: web
    name: qema-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Render free tier — upgrade to "standard" for always-on
    plan: free
    # Apply the Drizzle schema before starting the API service.
    preDeployCommand: pnpm --filter @workspace/db run push
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      # ── Database ────────────────────────────────────────────────────────────
      # Set DATABASE_URL in the Render dashboard → Environment
      - key: DATABASE_URL
        sync: false
      # ── Auth ────────────────────────────────────────────────────────────────
      - key: SESSION_SECRET
        generateValue: true
      # ── AI (OpenAI via Replit integration or direct key) ────────────────────
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_BASE_URL
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_API_KEY
        sync: false
      # ── Object storage ──────────────────────────────────────────────────────
      - key: DEFAULT_OBJECT_STORAGE_BUCKET_ID
        sync: false
      - key: PRIVATE_OBJECT_DIR
        sync: false
      - key: PUBLIC_OBJECT_SEARCH_PATHS
        sync: false
      # ── CORS: add your Render domain once deployed ──────────────────────────
      # e.g. CORS_ALLOWED_ORIGINS=https://qema-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # ── Duffel (flights) ────────────────────────────────────────────────────
      - key: DUFFEL_API_KEY
        sync: false

  # ── Expo Web frontend ─────────────────────────────────────────────────────
  - type: static
    name: qema-mobile-web
    plan: free
    buildCommand: >-
      corepack enable && pnpm install --no-frozen-lockfile &&
      EXPO_PUBLIC_DOMAIN=qema-api.onrender.com
      pnpm --filter @workspace/mobile-app exec expo export
      --platform web --output-dir dist-web
    staticPublishPath: ./artifacts/mobile-app/dist-web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_DOMAIN
        value: qema-api.onrender.com
      - key: NODE_ENV
        value: production
      - key: EXPO_PUBLIC_API_URL
        value: https://qema-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://qema-api.onrender.com
    autoDeploy: true
    branch: main

previewsEnabled: false
