components:
  schemas:
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `image/jpeg`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    UserRole:
      type: string
      enum: [customer, admin]

    User:
      type: object
      required: [id, fullName, phone, role, language, currency, createdAt]
      properties:
        id: { type: integer }
        fullName: { type: string }
        phone: { type: string }
        email: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        role:
          $ref: "#/components/schemas/UserRole"
        language: { type: string }
        currency: { type: string }
        createdAt: { type: string, format: date-time }

    EmployeeInput:
      type: object
      required: [fullName, phone, password]
      properties:
        fullName: { type: string, minLength: 1 }
        phone: { type: string, minLength: 3 }
        email: { type: string }
        password: { type: string, minLength: 6 }

    EmployeeUpdate:
      type: object
      properties:
        fullName: { type: string, minLength: 1 }
        phone: { type: string, minLength: 3 }
        email: { type: ["string", "null"] }
        password: { type: string, minLength: 6 }

    PaymentMethod:
      type: string
      enum: [cash, bank_transfer, card, other]

    PaymentStatus:
      type: string
      enum: [pending, paid, refunded, failed]

    Payment:
      type: object
      required:
        [
          id,
          referenceNumber,
          bookingType,
          customerName,
          customerPhone,
          amount,
          currency,
          method,
          status,
          createdAt,
        ]
      properties:
        id: { type: integer }
        referenceNumber: { type: string }
        bookingType: { type: string }
        flightBookingId: { type: ["integer", "null"] }
        packageBookingId: { type: ["integer", "null"] }
        visaApplicationId: { type: ["integer", "null"] }
        customerName: { type: string }
        customerPhone: { type: string }
        amount: { type: string }
        currency: { type: string }
        method:
          $ref: "#/components/schemas/PaymentMethod"
        status:
          $ref: "#/components/schemas/PaymentStatus"
        transactionId: { type: ["string", "null"] }
        paidAt: { type: ["string", "null"], format: date-time }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    PaymentInput:
      type: object
      required: [bookingType, customerName, customerPhone, amount, currency]
      properties:
        bookingType: { type: string }
        flightBookingId: { type: ["integer", "null"] }
        packageBookingId: { type: ["integer", "null"] }
        visaApplicationId: { type: ["integer", "null"] }
        customerName: { type: string, minLength: 1 }
        customerPhone: { type: string, minLength: 3 }
        amount: { type: string }
        currency: { type: string }
        method:
          $ref: "#/components/schemas/PaymentMethod"
        status:
          $ref: "#/components/schemas/PaymentStatus"
        transactionId: { type: ["string", "null"] }
        paidAt: { type: ["string", "null"], format: date-time }
        notes: { type: ["string", "null"] }

    PaymentUpdate:
      type: object
      properties:
        bookingType: { type: string }
        flightBookingId: { type: ["integer", "null"] }
        packageBookingId: { type: ["integer", "null"] }
        visaApplicationId: { type: ["integer", "null"] }
        customerName: { type: string, minLength: 1 }
        customerPhone: { type: string, minLength: 3 }
        amount: { type: string }
        currency: { type: string }
        method:
          $ref: "#/components/schemas/PaymentMethod"
        status:
          $ref: "#/components/schemas/PaymentStatus"
        transactionId: { type: ["string", "null"] }
        paidAt: { type: ["string", "null"], format: date-time }
        notes: { type: ["string", "null"] }

    InvoiceStatus:
