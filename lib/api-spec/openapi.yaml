      operationId: searchFlights
      tags: [flights]
      summary: Search flight offers
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          required: true
          schema:
            type: string
        - name: departDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: returnDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: tripType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TripType"
        - name: adults
          in: query
          required: false
          schema:
            type: integer
        - name: children
          in: query
          required: false
          schema:
            type: integer
        - name: infants
          in: query
          required: false
          schema:
            type: integer
        - name: cabinClass
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CabinClass"
      responses:
        "200":
          description: Flight offers
          content:
            application/json:
              schema:
